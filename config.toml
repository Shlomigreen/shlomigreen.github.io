baseURL = "https://shlomigreen.github.io/"
languageCode = "en"
title = "Shlomi Green"

# Only the home page and individual (archived) posts are built.
disableKinds = ["taxonomy", "term", "section", "RSS", "sitemap"]

[markup.highlight]
  # Inline colors for code blocks in archived posts; no extra CSS needed.
  noClasses = true

[params]
  # Shown on the card and in the page <title>
  name = "Shlomi Green"
  # Shown under the name, in mono
  handle = "@shlomigreen"
  # Profile picture URL (or a path under static/, e.g. "/me.jpg")
  avatar = "https://avatars.githubusercontent.com/u/31320788?v=4"
  # Meta description for search engines and link previews
  description = "AI engineer, tech lead, and 3D printing artist."
  # Typed one at a time after "~ whoami". The chip width fits the longest one.
  titles = ["ai-engineer", "tech-lead", "data-scientist", "team-lead", "ai-builder", "3d-printing-artist"]

  # Social links, shown left to right.
  # icon = a Font Awesome Free brand name: https://fontawesome.com/search?ic=brands
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/Shlomigreen"
    icon = "github"
  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/shlomigreen/"
    icon = "linkedin"
  [[params.social]]
    name = "X"
    url = "https://x.com/theshlomigreen"
    icon = "x-twitter"
